kind = "web"
previewPath = "/"
title = "OpenShelf Library"
description = "A shared community library where readers can browse and search books, upload new titles, switch reading themes, and open books in an in-browser reader."
version = "1.0.0"
id = "artifacts/openshelf"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18102

[services.development]
run = "pnpm --filter @workspace/openshelf run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/openshelf", "run", "build" ]
serve = "static"
publicDir = "artifacts/openshelf/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18102"
BASE_PATH = "/"
